name: Rollback / redespliegue de una release publicada

# Reversa sin compilar: vuelve a desplegar una release YA publicada y verificada.
# Para prod aplican las mismas reglas del environment (aprobación de otra persona).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente destino
        type: choice
        options: [dev, qa, prod]
        required: true
      version:
        description: Versión publicada a desplegar (p. ej. 1.0.41)
        type: string
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  redeploy:
    name: ${{ inputs.environment }} · v${{ inputs.version }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.environment }}
      version: ${{ inputs.version }}
    secrets: inherit
